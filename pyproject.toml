[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automuse-forge-api"
version = "0.1.0"
description = "Dependency-free REST client for Stable Diffusion WebUI Forge"
requires-python = ">=3.10"

[project.scripts]
forge-preflight = "forge_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
